name: Build EFHC Offline Demo Simulator APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - EFHC_Visual_Demo.zip
      - .github/workflows/android-build-simulator.yml

permissions:
  contents: read

concurrency:
  group: efhc-offline-simulator-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ARCHIVE: EFHC_Visual_Demo.zip
  BUILD_ROOT: ${{ github.workspace }}/.ci-extracted
  PROJECT_ROOT_NAME: EFHC_Visual_Demo
  EXPECTED_APPLICATION_ID: org.federationofavatars.efhc.simulator
  EXPECTED_MIN_SDK: "26"
  EXPECTED_TARGET_SDK: "36"
  EXPECTED_DEMO_MODE: offline_simulator
  EXPECTED_DEMO_BACKEND: local_demo_engine

jobs:
  build-apk:
    name: Validate, test and build EFHC offline simulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect simulator Development signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.EFHC_DEMO_DEV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EFHC_DEMO_DEV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EFHC_DEMO_DEV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EFHC_DEMO_DEV_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.EFHC_DEMO_DEV_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          missing=()
          [ -n "${KEYSTORE_B64:-}" ] || missing+=("EFHC_DEMO_DEV_KEYSTORE_BASE64")
          [ -n "${STORE_PASSWORD:-}" ] || missing+=("EFHC_DEMO_DEV_KEYSTORE_PASSWORD")
          [ -n "${KEY_ALIAS:-}" ] || missing+=("EFHC_DEMO_DEV_KEY_ALIAS")
          [ -n "${KEY_PASSWORD:-}" ] || missing+=("EFHC_DEMO_DEV_KEY_PASSWORD")
          [ -n "${EXPECTED_CERT_SHA256:-}" ] || missing+=("EFHC_DEMO_DEV_CERT_SHA256")

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "artifact_class=DEVELOPMENT" >> "$GITHUB_OUTPUT"
            echo "Signing mode: CANONICAL DEVELOPMENT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "artifact_class=NON_CANONICAL_DEBUG" >> "$GITHUB_OUTPUT"
            echo "::warning::Permanent EFHC simulator Development signing is not configured."
            printf '::warning::Missing signing setting: %s\n' "${missing[@]}"
            echo "::warning::The APK is suitable for uninstall/reinstall testing only; update continuity is not guaranteed."
          fi

      - name: Verify EFHC simulator source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f "$SOURCE_ARCHIVE" || {
            echo "ERROR: $SOURCE_ARCHIVE not found in repository root."
            exit 1
          }
          unzip -t "$SOURCE_ARCHIVE"
          sha256sum "$SOURCE_ARCHIVE" | tee EFHC_Visual_Demo.zip.sha256
          echo "[PASS] source archive exists"
          echo "[PASS] ZIP integrity"

      - name: Extract archive and locate simulator projects
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"
          unzip -q "$SOURCE_ARCHIVE" -d "$BUILD_ROOT"

          PROJECT_ROOT="$BUILD_ROOT/$PROJECT_ROOT_NAME"
          test -d "$PROJECT_ROOT" || {
            echo "ERROR: top-level directory must be $PROJECT_ROOT_NAME/."
            exit 1
          }
          test -f "$PROJECT_ROOT/SIMULATOR_CONTRACT.json" || {
            echo "ERROR: SIMULATOR_CONTRACT.json is missing."
            exit 1
          }
          test -f "$PROJECT_ROOT/frontend/package.json" || {
            echo "ERROR: frontend/package.json is missing."
            exit 1
          }
          test -f "$PROJECT_ROOT/frontend/package-lock.json" || {
            echo "ERROR: frontend/package-lock.json is missing."
            exit 1
          }

          mapfile -t SETTINGS_FILES < <(
            find "$PROJECT_ROOT" -type f \( -name settings.gradle -o -name settings.gradle.kts \) | sort
          )
          test "${#SETTINGS_FILES[@]}" -eq 1 || {
            echo "ERROR: expected exactly one Gradle root, found ${#SETTINGS_FILES[@]}."
            printf '%s\n' "${SETTINGS_FILES[@]}"
            exit 1
          }

          ANDROID_DIR="$(dirname "${SETTINGS_FILES[0]}")"
          test -f "$ANDROID_DIR/gradlew" || {
            echo "ERROR: Gradle Wrapper is missing."
            exit 1
          }
          test -f "$ANDROID_DIR/app/build.gradle.kts" -o -f "$ANDROID_DIR/app/build.gradle" || {
            echo "ERROR: Android app module is missing."
            exit 1
          }

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "frontend_dir=$PROJECT_ROOT/frontend" >> "$GITHUB_OUTPUT"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"
          echo "[PASS] canonical simulator structure"

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ steps.project.outputs.frontend_dir }}/package-lock.json

      - name: Validate simulator source contract
        shell: bash
        env:
          CONTRACT_PATH: ${{ steps.project.outputs.project_root }}/SIMULATOR_CONTRACT.json
        run: |
          set -Eeuo pipefail
          python3 - "$CONTRACT_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          contract = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "mode": "offline_simulator",
              "backend": "local_demo_engine",
              "network_access": False,
              "production_api_enabled": False,
              "real_financial_operations": False,
              "demo_marker_required": True,
              "data_generation": "deterministic_seeded",
              "state_storage": "local_only",
          }
          for key, value in expected.items():
              actual = contract.get(key)
              if actual != value:
                  raise SystemExit(
                      f"ERROR: simulator contract {key}={actual!r}; expected {value!r}"
                  )

          for key in ("simulator_version", "source_efhc_version", "demo_seed"):
              value = contract.get(key)
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(f"ERROR: simulator contract {key} must be a non-empty string")

          source_sha = contract.get("source_archive_sha256")
          if (
              not isinstance(source_sha, str)
              or len(source_sha) != 64
              or any(ch not in "0123456789abcdefABCDEF" for ch in source_sha)
          ):
              raise SystemExit("ERROR: source_archive_sha256 must be a 64-character hex digest")
          print("[PASS] simulator source contract")
          PY

      - name: Install frontend dependencies
        shell: bash
        working-directory: ${{ steps.project.outputs.frontend_dir }}
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          echo "[PASS] npm ci"

      - name: Validate required simulator scripts
        shell: bash
        working-directory: ${{ steps.project.outputs.frontend_dir }}
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const pkg = require("./package.json");
          const required = ["typecheck", "test:demo", "build:demo"];
          for (const name of required) {
            if (!pkg.scripts || typeof pkg.scripts[name] !== "string" || !pkg.scripts[name].trim()) {
              throw new Error(`Required npm script is missing: ${name}`);
            }
          }
          console.log("[PASS] required npm scripts");
          NODE

      - name: Type-check and test demo engine
        shell: bash
        working-directory: ${{ steps.project.outputs.frontend_dir }}
        run: |
          set -Eeuo pipefail
          npm run typecheck
          npm run test:demo
          echo "[PASS] TypeScript typecheck"
          echo "[PASS] local demo engine tests"

      - name: Build offline simulator web assets
        shell: bash
        working-directory: ${{ steps.project.outputs.frontend_dir }}
        env:
          EFHC_RUNTIME_MODE: offline_simulator
          NEXT_PUBLIC_EFHC_RUNTIME_MODE: offline_simulator
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -Eeuo pipefail
          npm run build:demo

          test -f out/index.html || {
            echo "ERROR: static simulator export out/index.html is missing."
            exit 1
          }
          test -f ../android/app/src/main/assets/web/index.html || {
            echo "ERROR: Android web assets were not synchronized."
            exit 1
          }
          test -f ../android/app/src/main/assets/web/simulator-contract.json || {
            echo "ERROR: embedded simulator-contract.json is missing."
            exit 1
          }
          echo "[PASS] static offline frontend export"
          echo "[PASS] Android local assets synchronization"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Gradle Wrapper
        shell: bash
        working-directory: ${{ steps.project.outputs.android_dir }}
        run: |
          set -Eeuo pipefail
          chmod +x ./gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            test -f gradle/wrapper/WrapperDownloader.java || {
              echo "ERROR: wrapper JAR and downloader are missing."
              exit 1
            }
            java gradle/wrapper/WrapperDownloader.java gradle/wrapper/gradle-wrapper.jar
          fi
          echo "[PASS] Gradle Wrapper"

      - name: Set up Gradle cache and validation
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -1)"
          fi
          test -n "$SDKMANAGER" -a -x "$SDKMANAGER" || {
            echo "ERROR: sdkmanager not found."
            exit 1
          }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "[PASS] Android SDK 36"

      - name: Restore and verify simulator Development keystore
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.EFHC_DEMO_DEV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EFHC_DEMO_DEV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EFHC_DEMO_DEV_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ vars.EFHC_DEMO_DEV_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          umask 077
          SIGNING_DIR="$GITHUB_WORKSPACE/.ci-signing"
          KEYSTORE_PATH="$SIGNING_DIR/efhc-simulator-development.jks"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          ACTUAL_KEY_FP="$(
            keytool -list -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | head -1 \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]'
          )"
          EXPECTED_KEY_FP="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL_KEY_FP" || {
            echo "ERROR: Development certificate SHA-256 not found."
            exit 1
          }
          test "$ACTUAL_KEY_FP" = "$EXPECTED_KEY_FP" || {
            echo "ERROR: Development certificate mismatch."
            exit 1
          }
          echo "DEV_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "[PASS] canonical Development signer"

      - name: Run Android tests, lint and build APK
        shell: bash
        working-directory: ${{ steps.project.outputs.android_dir }}
        env:
          SIGNING_READY: ${{ steps.signing.outputs.ready }}
          EFHC_DEMO_DEV_SIGNING_STORE_FILE: ${{ env.DEV_KEYSTORE_PATH }}
          EFHC_DEMO_DEV_SIGNING_STORE_PASSWORD: ${{ secrets.EFHC_DEMO_DEV_KEYSTORE_PASSWORD }}
          EFHC_DEMO_DEV_SIGNING_KEY_ALIAS: ${{ secrets.EFHC_DEMO_DEV_KEY_ALIAS }}
          EFHC_DEMO_DEV_SIGNING_KEY_PASSWORD: ${{ secrets.EFHC_DEMO_DEV_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [ "$SIGNING_READY" != "true" ]; then
            echo "::warning::Building NON_CANONICAL_DEBUG for uninstall/reinstall testing."
            unset EFHC_DEMO_DEV_SIGNING_STORE_FILE
            unset EFHC_DEMO_DEV_SIGNING_STORE_PASSWORD
            unset EFHC_DEMO_DEV_SIGNING_KEY_ALIAS
            unset EFHC_DEMO_DEV_SIGNING_KEY_PASSWORD
          fi

          ./gradlew --no-daemon --stacktrace \
            clean \
            testDebugUnitTest \
            lintDebug \
            compileDebugKotlin \
            assembleDebug

          echo "[PASS] Gradle unit tests"
          echo "[PASS] Android lint"
          echo "[PASS] compileDebugKotlin"
          echo "[PASS] assembleDebug"

      - name: Collect and verify offline simulator APK
        id: artifact
        shell: bash
        working-directory: ${{ steps.project.outputs.android_dir }}
        env:
          SIGNING_READY: ${{ steps.signing.outputs.ready }}
          EXPECTED_CERT_SHA256: ${{ vars.EFHC_DEMO_DEV_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-artifact"
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          mapfile -t APKS < <(find app/build/outputs/apk/debug -type f -name '*.apk' | sort)
          test "${#APKS[@]}" -eq 1 || {
            echo "ERROR: expected exactly one APK, found ${#APKS[@]}."
            printf '%s\n' "${APKS[@]}"
            exit 1
          }
          APK_SOURCE="${APKS[0]}"
          echo "[PASS] APK exists"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER" || { echo "ERROR: apksigner not found."; exit 1; }
          test -x "$AAPT" || { echo "ERROR: aapt not found."; exit 1; }

          "$APKSIGNER" verify --verbose --print-certs "$APK_SOURCE" \
            | tee "$OUTPUT_DIR/APKSIGNER_VERIFY.txt"
          echo "[PASS] APK signature verification"

          ACTUAL_SIGNER="$(
            sed -n -E 's/^.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+)[[:space:]]*$/\1/p' \
              "$OUTPUT_DIR/APKSIGNER_VERIFY.txt" \
            | head -1 \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]'
          )"
          test -n "$ACTUAL_SIGNER" || {
            echo "ERROR: signer fingerprint not found."
            exit 1
          }

          if [ "$SIGNING_READY" = "true" ]; then
            BUILD_CLASS="DEVELOPMENT"
            EXPECTED_SIGNER="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
            test "$ACTUAL_SIGNER" = "$EXPECTED_SIGNER" || {
              echo "ERROR: APK signer mismatch."
              exit 1
            }
            SIGNING_IDENTITY_VERIFICATION="PASS"
            echo "[PASS] signer continuity"
          else
            BUILD_CLASS="NON_CANONICAL_DEBUG"
            SIGNING_IDENTITY_VERIFICATION="NON_CANONICAL"
            echo "::warning::Signer continuity is not enforced in NON_CANONICAL_DEBUG."
          fi

          BADGING="$("$AAPT" dump badging "$APK_SOURCE")"
          printf '%s\n' "$BADGING" > "$OUTPUT_DIR/AAPT_BADGING.txt"
          PACKAGE_LINE="$(printf '%s\n' "$BADGING" | grep -m1 '^package:' || true)"
          APP_ID="$(printf '%s\n' "$PACKAGE_LINE" | awk -F"'" '{print $2}')"
          VERSION_CODE="$(printf '%s\n' "$PACKAGE_LINE" | awk -F"'" '{print $4}')"
          VERSION_NAME="$(printf '%s\n' "$PACKAGE_LINE" | awk -F"'" '{print $6}')"
          MIN_SDK="$(printf '%s\n' "$BADGING" | sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p" | head -1)"
          TARGET_SDK="$(printf '%s\n' "$BADGING" | sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p" | head -1)"
          printf '%s\n' "$BADGING" | grep -q '^application-debuggable' && DEBUGGABLE=true || DEBUGGABLE=false

          BUILD_FILE="app/build.gradle.kts"
          if [ ! -f "$BUILD_FILE" ]; then BUILD_FILE="app/build.gradle"; fi
          SOURCE_VERSION_CODE="$(sed -n -E 's/^[[:space:]]*versionCode[[:space:]]*(=)?[[:space:]]*([0-9]+).*/\2/p' "$BUILD_FILE" | head -1)"
          SOURCE_VERSION_NAME="$(sed -n -E 's/^[[:space:]]*versionName[[:space:]]*(=)?[[:space:]]*["'\'']([^"'\'']+)["'\''].*/\2/p' "$BUILD_FILE" | head -1)"
          test -n "$SOURCE_VERSION_CODE" -a -n "$SOURCE_VERSION_NAME" || {
            echo "ERROR: source version metadata not found."
            exit 1
          }

          verify_metadata() {
            local label="$1" actual="$2" expected="$3"
            test "$actual" = "$expected" || {
              printf 'ERROR: metadata %s mismatch: actual=%s expected=%s\n' \
                "$label" "${actual:-<empty>}" "$expected"
              exit 1
            }
            printf '[PASS] %s = %s\n' "$label" "$actual"
          }

          verify_metadata applicationId "$APP_ID" "$EXPECTED_APPLICATION_ID"
          verify_metadata versionCode "$VERSION_CODE" "$SOURCE_VERSION_CODE"
          verify_metadata versionName "$VERSION_NAME" "$SOURCE_VERSION_NAME"
          verify_metadata minSdk "$MIN_SDK" "$EXPECTED_MIN_SDK"
          verify_metadata targetSdk "$TARGET_SDK" "$EXPECTED_TARGET_SDK"
          test "$DEBUGGABLE" = true || {
            echo "ERROR: simulator Development/debug APK must be debuggable."
            exit 1
          }

          "$AAPT" dump permissions "$APK_SOURCE" \
            | tee "$OUTPUT_DIR/AAPT_PERMISSIONS.txt"
          if grep -q 'android.permission.INTERNET' "$OUTPUT_DIR/AAPT_PERMISSIONS.txt"; then
            echo "ERROR: offline simulator APK must not request android.permission.INTERNET."
            exit 1
          fi
          for permission in \
            android.permission.CAMERA \
            android.permission.RECORD_AUDIO \
            android.permission.ACCESS_FINE_LOCATION \
            android.permission.READ_CONTACTS; do
            if grep -q "$permission" "$OUTPUT_DIR/AAPT_PERMISSIONS.txt"; then
              echo "ERROR: forbidden simulator permission detected: $permission"
              exit 1
            fi
          done
          echo "[PASS] offline and dangerous-permission gate"

          CONTRACT_ENTRY="assets/web/simulator-contract.json"
          unzip -l "$APK_SOURCE" | awk '{print $4}' | grep -Fxq "$CONTRACT_ENTRY" || {
            echo "ERROR: embedded $CONTRACT_ENTRY not found in APK."
            exit 1
          }
          unzip -p "$APK_SOURCE" "$CONTRACT_ENTRY" > "$OUTPUT_DIR/SIMULATOR_CONTRACT.json"
          python3 - "$OUTPUT_DIR/SIMULATOR_CONTRACT.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          contract = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "mode": "offline_simulator",
              "backend": "local_demo_engine",
              "network_access": False,
              "production_api_enabled": False,
              "real_financial_operations": False,
              "demo_marker_required": True,
              "data_generation": "deterministic_seeded",
              "state_storage": "local_only",
          }
          for key, value in expected.items():
              if contract.get(key) != value:
                  raise SystemExit(f"ERROR: embedded simulator contract mismatch for {key}")

          for key in ("simulator_version", "source_efhc_version", "demo_seed"):
              value = contract.get(key)
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(f"ERROR: embedded simulator contract {key} is empty")

          source_sha = contract.get("source_archive_sha256")
          if (
              not isinstance(source_sha, str)
              or len(source_sha) != 64
              or any(ch not in "0123456789abcdefABCDEF" for ch in source_sha)
          ):
              raise SystemExit("ERROR: embedded source_archive_sha256 is invalid")
          print("[PASS] embedded simulator contract")
          PY

          SAFE_VERSION_NAME="$(printf '%s' "$VERSION_NAME" | tr -c 'A-Za-z0-9._-' '_')"
          APK_NAME="EFHC-Offline-Simulator-v${SAFE_VERSION_NAME}-${BUILD_CLASS}-b${VERSION_CODE}.apk"
          ARTIFACT_NAME="EFHC-Offline-Simulator-v${SAFE_VERSION_NAME}-${BUILD_CLASS}-${VERSION_CODE}"
          APK="$OUTPUT_DIR/$APK_NAME"
          cp "$APK_SOURCE" "$APK"

          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "$APK_NAME" > "$OUTPUT_DIR/APK_SHA256SUMS.txt"
          cp "$GITHUB_WORKSPACE/EFHC_Visual_Demo.zip.sha256" "$OUTPUT_DIR/"
          echo "[PASS] APK SHA-256"

          cat > "$OUTPUT_DIR/BUILD_SIGNING_REPORT.txt" <<EOF
          Product: EFHC Offline Demo Simulator
          Build class: $BUILD_CLASS
          Distribution: INTERNAL VISUAL AND SCENARIO TESTING ONLY
          Production release: NO
          Runtime mode: offline_simulator
          Backend mode: local_demo_engine
          Network permission: ABSENT
          Real financial operations: DISABLED
          Application ID: $APP_ID
          Version name: $VERSION_NAME
          Version code: $VERSION_CODE
          Debuggable: $DEBUGGABLE
          Min SDK: $MIN_SDK
          Target SDK: $TARGET_SDK
          APK filename: $APK_NAME
          APK SHA-256: $APK_SHA256
          Signer SHA-256: $ACTUAL_SIGNER
          Signature verification: PASS
          Signing identity verification: $SIGNING_IDENTITY_VERIFICATION
          Offline contract verification: PASS
          EOF

          if [ "$SIGNING_READY" != "true" ]; then
            cat >> "$OUTPUT_DIR/BUILD_SIGNING_REPORT.txt" <<EOF
          Update continuity: NOT GUARANTEED
          Install mode: UNINSTALL PREVIOUS APK IF SIGNER DIFFERS
          EOF
          fi

          echo "artifact_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          cat "$OUTPUT_DIR/BUILD_SIGNING_REPORT.txt"

      - name: Remove temporary Development keystore
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/.ci-signing"

      - name: Upload simulator APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Mark EFHC offline simulator APK gate PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "[PASS] artifact upload"
          echo "EFHC_OFFLINE_SIMULATOR_APK_ARTIFACT_PASS"
